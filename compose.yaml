services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mixtaipes:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mixtaipes?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only: a reverse proxy on the host terminates TLS and forwards here.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mixtaipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mixtaipes
    ports:
      # Loopback only: lets `make run` and psql reach the database from the host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixtaipes -d mixtaipes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
