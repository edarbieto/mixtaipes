# Prompt evaluation cases (ADR-005). Run with `make eval`; it spends real quota.
#
# Each case runs its turns in order: the first as a new request, the rest as
# refinements (ADR-008). `expect` applies to the last turn; earlier turns of an
# `ok` case must be `ok` too.
#
#   expect.status             ok | refused
#   expect.refusal_reason     optional: off_topic | unsafe | unclear
#   expect.min_tracks/max_tracks  bounds on the tracks the LLM proposed
#   expect.title_not_contains optional: text that must not leak into the title

# --- plain requests ---
- id: rainy-night-drive
  category: plain
  locale: en
  turns: ["music for driving a 90s BMW on a rainy night in a coastal city"]
  expect: { status: ok, min_tracks: 20, max_tracks: 20 }

- id: sunday-coffee
  category: plain
  locale: en
  turns: ["slow Sunday morning with coffee and the newspaper"]
  expect: { status: ok, min_tracks: 20, max_tracks: 20 }

- id: workout
  category: plain
  locale: en
  turns: ["high-energy songs for a heavy leg day at the gym"]
  expect: { status: ok, min_tracks: 20, max_tracks: 20 }

- id: breakup-sad
  category: plain
  locale: en
  turns: ["songs to cry to after a breakup, really dark and heartbroken"]
  expect: { status: ok, min_tracks: 20, max_tracks: 20 }

- id: abstract-color
  category: plain
  locale: en
  turns: ["the color orange in late October"]
  expect: { status: ok, min_tracks: 20, max_tracks: 20 }

